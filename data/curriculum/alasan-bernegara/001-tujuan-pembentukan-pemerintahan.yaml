id: ALS-KENALI-001
domain: alasan-bernegara
level: kenali
type: multiple-choice
question: Manakah rumusan yang termasuk tujuan pembentukan Pemerintah Negara Indonesia dalam Pembukaan UUD 1945 alinea keempat?
options:
  - Melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia
  - Mewujudkan keseimbangan kekuasaan dengan negara-negara tetangga
  - Menjamin pemerataan pendapatan yang sama bagi seluruh warga
  - Membangun pemerintahan yang terpusat di seluruh wilayah negara
answer: 0
explanation: Pembukaan UUD 1945 alinea keempat menyebut tujuan pembentukan Pemerintah Negara Indonesia, termasuk melindungi segenap bangsa dan seluruh tumpah darah Indonesia. Tujuan lainnya adalah memajukan kesejahteraan umum, mencerdaskan kehidupan bangsa, serta ikut melaksanakan ketertiban dunia.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pembukaan alinea keempat. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
