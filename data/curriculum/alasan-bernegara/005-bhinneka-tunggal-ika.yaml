id: ALS-KENALI-005
domain: alasan-bernegara
level: pahami
type: multiple-choice
question: Apa pesan kewargaan yang paling sesuai dengan semboyan Bhinneka Tunggal Ika pada lambang negara?
options:
  - Perbedaan dalam masyarakat dapat hidup dalam kesatuan sebagai bangsa
  - Kesatuan bangsa mensyaratkan kesamaan seluruh identitas budaya
  - Setiap kelompok dapat membentuk ikatan kebangsaan yang terpisah
  - Perbedaan sosial perlu dihapus sebelum warga dapat berpartisipasi
answer: 0
explanation: Pasal 36A UUD 1945 menetapkan Garuda Pancasila dengan semboyan Bhinneka Tunggal Ika sebagai lambang negara. Semboyan itu mengingatkan bahwa keberagaman masyarakat Indonesia dapat disatukan oleh kehidupan kebangsaan bersama, bukan dihapus dengan menyeragamkan identitas.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 36A. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
