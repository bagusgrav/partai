id: ALS-KENALI-007
domain: alasan-bernegara
level: pahami
type: multiple-choice
question: Mengapa prinsip negara hukum dalam Pasal 1 ayat (3) UUD 1945 penting bagi warga negara?
options:
  - Agar penyelenggara negara menggunakan kekuasaan berdasarkan hukum dan dapat dimintai pertanggungjawaban
  - Agar pejabat terpilih dapat mengesampingkan hukum ketika memperoleh dukungan mayoritas
  - Agar kebijakan pemerintah hanya dinilai melalui pemilu, bukan melalui proses hukum
  - Agar hukum membatasi warga, tetapi tidak membatasi penyelenggara negara
answer: 0
explanation: Pasal 1 ayat (3) UUD 1945 menegaskan bahwa Indonesia adalah negara hukum. Prinsip ini mengharuskan kekuasaan publik dijalankan dalam kerangka hukum, sehingga pejabat maupun warga tunduk pada aturan yang berlaku.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 1 ayat (3) dan Pasal 27 ayat (1). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
