id: ALS-KENALI-010
domain: alasan-bernegara
level: pahami
type: multiple-choice
question: Dalam negara demokratis berdasarkan UUD 1945, bagaimana warga dapat berpartisipasi dalam pengambilan keputusan publik nasional?
options:
  - Melalui pemilihan wakil dan mekanisme partisipasi yang dijamin hukum, tanpa menggantikan prosedur konstitusional
  - Dengan mengesampingkan prosedur pembentukan undang-undang apabila aspirasi didukung mayoritas
  - Hanya melalui pemilihan umum, tanpa mekanisme partisipasi lain yang diatur hukum
  - Dengan menyerahkan seluruh keputusan publik kepada wakil terpilih tanpa pengawasan warga
answer: 0
explanation: UUD 1945 mengatur kedaulatan rakyat yang dilaksanakan menurut konstitusi, termasuk melalui pemilihan umum dan lembaga perwakilan. Partisipasi publik memperkuat pengambilan keputusan, tetapi perubahan hukum dan kebijakan tetap harus mengikuti kewenangan serta prosedur yang ditetapkan.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 1 ayat (2), Pasal 19, dan Pasal 22E. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
