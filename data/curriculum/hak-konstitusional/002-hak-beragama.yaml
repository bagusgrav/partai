id: HAK-KENALI-002
domain: hak-konstitusional
level: pahami
type: multiple-choice
question: Apa kewajiban negara menurut Pasal 29 ayat (2) UUD 1945 terkait agama dan kepercayaan?
options:
  - Menyediakan kebebasan beribadah hanya bagi warga negara
  - Menjamin kemerdekaan tiap-tiap penduduk untuk memeluk agama dan beribadat menurut agama serta kepercayaannya
  - Menjamin kemerdekaan memeluk agama, tetapi tidak menjalankan ibadah
  - Menyerahkan jaminan kebebasan beragama kepada pemerintah daerah masing-masing
answer: 1
explanation: Pasal 29 ayat (2) UUD 1945 mewajibkan negara menjamin kemerdekaan tiap-tiap penduduk untuk memeluk agama dan beribadat menurut agama serta kepercayaannya. Jaminan ini menempatkan perlindungan kebebasan beragama sebagai tanggung jawab negara, bukan monopoli kelompok tertentu.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 29 ayat (2). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
