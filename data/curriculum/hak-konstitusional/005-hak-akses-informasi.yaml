id: HAK-KENALI-005
domain: hak-konstitusional
level: pahami
type: multiple-choice
question: Menurut Pasal 28F UUD 1945, cakupan hak berkomunikasi dan memperoleh informasi meliputi apa?
options:
  - Memperoleh informasi dari pemerintah, tetapi tidak menyampaikan informasi kepada pihak lain
  - Mencari, memperoleh, memiliki, menyimpan, mengolah, dan menyampaikan informasi melalui berbagai saluran yang tersedia
  - Menyampaikan informasi melalui media cetak, tetapi tidak melalui saluran elektronik
  - Memperoleh informasi hanya untuk kepentingan pribadi, tanpa hak untuk mengolahnya
answer: 1
explanation: Pasal 28F menjamin hak setiap orang untuk berkomunikasi dan memperoleh informasi, termasuk mencari, memperoleh, memiliki, menyimpan, mengolah, dan menyampaikannya. Hak tersebut tidak berarti informasi pribadi orang lain otomatis terbuka, karena pelaksanaannya tetap berhubungan dengan hak dan kewajiban lain dalam konstitusi dan undang-undang.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 28F, Pasal 28G ayat (1), dan Pasal 28J. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
