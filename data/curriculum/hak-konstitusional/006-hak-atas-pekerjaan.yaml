id: HAK-KENALI-006
domain: hak-konstitusional
level: kenali
type: multiple-choice
question: Hak dan kewajiban apa yang dinyatakan dalam Pasal 27 ayat (2) UUD 1945?
options:
  - Tiap-tiap warga negara berhak atas pekerjaan dan penghidupan yang layak bagi kemanusiaan
  - Tiap-tiap warga negara berhak memperoleh imbalan dan perlakuan yang adil dan layak dalam hubungan kerja
  - Tiap-tiap warga negara berhak memperoleh pekerjaan tertentu tanpa memperhatikan kualifikasi
  - Tiap-tiap warga negara berhak menetapkan sendiri syarat kerja yang berlaku bagi semua perusahaan
answer: 0
explanation: Pasal 27 ayat (2) UUD 1945 menyatakan bahwa tiap-tiap warga negara berhak atas pekerjaan dan penghidupan yang layak bagi kemanusiaan. Ketentuan ini menjamin hak konstitusional, bukan hak otomatis untuk memperoleh jabatan tertentu tanpa persyaratan.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 27 ayat (2). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
