id: HAK-KENALI-007
domain: hak-konstitusional
level: pahami
type: multiple-choice
question: Mengapa hak untuk tidak disiksa mendapat perlindungan khusus dalam Pasal 28I ayat (1) UUD 1945?
options:
  - Karena hak tersebut hanya dapat dibatasi melalui undang-undang dalam keadaan darurat
  - Karena hak tersebut termasuk hak yang tidak dapat dikurangi dalam keadaan apa pun
  - Karena hak tersebut dapat ditangguhkan melalui keputusan pejabat yang berwenang
  - Karena perlindungannya hanya berlaku bagi orang yang belum menjalani proses hukum
answer: 1
explanation: Pasal 28I ayat (1) UUD 1945 memasukkan hak untuk tidak disiksa ke dalam hak asasi manusia yang tidak dapat dikurangi dalam keadaan apa pun. Ketentuan ini membedakannya dari sejumlah hak lain yang pelaksanaannya dapat dibatasi dengan syarat konstitusional sebagaimana diatur dalam Pasal 28J.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 28I ayat (1) dan Pasal 28J. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
