id: HAK-KENALI-009
domain: hak-konstitusional
level: kenali
type: multiple-choice
question: Hak apa yang diakui bagi setiap orang menurut Pasal 28H ayat (3) UUD 1945?
options:
  - Hak atas jaminan sosial yang memungkinkan pengembangan dirinya secara utuh sebagai manusia bermartabat
  - Hak atas pelayanan kesehatan dan pelayanan umum yang layak
  - Hak memperoleh kemudahan dan perlakuan khusus untuk mencapai persamaan dan keadilan
  - Hak atas lingkungan hidup yang baik dan sehat
answer: 0
explanation: Pasal 28H ayat (3) UUD 1945 mengakui hak setiap orang atas jaminan sosial untuk memungkinkan pengembangan dirinya secara utuh sebagai manusia bermartabat. Pengaturan program dan manfaatnya tetap dilaksanakan berdasarkan ketentuan peraturan perundang-undangan.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 28H ayat (3). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
