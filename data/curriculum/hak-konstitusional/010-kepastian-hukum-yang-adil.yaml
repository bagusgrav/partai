id: HAK-KENALI-010
domain: hak-konstitusional
level: pahami
type: multiple-choice
question: Dalam perkara yang diputus berdasarkan aturan yang tidak jelas atau diterapkan berbeda tanpa alasan, hak konstitusional mana yang paling langsung berkaitan dengan kepastian hukum yang adil?
options:
  - Hak dalam Pasal 28D ayat (1) UUD 1945
  - Hak dalam Pasal 28H ayat (1) UUD 1945
  - Hak dalam Pasal 27 ayat (2) UUD 1945
  - Hak dalam Pasal 28I ayat (1) UUD 1945
answer: 0
explanation: Pasal 28D ayat (1) UUD 1945 menjamin pengakuan, jaminan, perlindungan, dan kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum. Karena itu, penerapan aturan dalam perkara harus dapat dipertanggungjawabkan dan tidak dilakukan secara sewenang-wenang.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 28D ayat (1). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
