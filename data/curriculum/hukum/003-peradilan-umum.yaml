id: HUK-KENALI-003
domain: hukum
level: kenali
type: multiple-choice
question: Pengadilan Negeri dalam lingkungan peradilan umum pada umumnya berwenang memeriksa perkara pada tingkat apa?
options:
  - Tingkat pertama
  - Kasasi
  - Peninjauan kembali
  - Pengujian undang-undang terhadap UUD 1945
answer: 0
explanation: Pengadilan Negeri merupakan pengadilan tingkat pertama dalam lingkungan peradilan umum. Pengadilan Tinggi memeriksa perkara pada tingkat banding, sedangkan kasasi menjadi kewenangan Mahkamah Agung.
sources:
  - citation: "UU Nomor 2 Tahun 1986 tentang Peradilan Umum, Pasal 50 dan Pasal 51, sebagaimana diubah dengan UU Nomor 8 Tahun 2004 dan UU Nomor 49 Tahun 2009."
