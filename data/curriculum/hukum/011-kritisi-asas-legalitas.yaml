question: Bagaimana asas legalitas diterapkan saat seseorang dituduh melakukan perbuatan yang belum diatur sebagai tindak pidana ketika perbuatan itu dilakukan?
instructions: Jelaskan penerapan asas legalitas pada situasi tersebut dan alasan perlindungannya bagi warga.
