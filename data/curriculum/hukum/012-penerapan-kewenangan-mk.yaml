id: HUK-ESSAY-012
domain: hukum
level: terapkan
type: essay
question: Seorang warga menilai sebuah undang-undang bertentangan dengan UUD 1945. Ke lembaga mana ia dapat mengajukan pengujian, dan apa yang perlu dibedakan dari pengujian peraturan di bawah undang-undang?
instructions: Uraikan lembaga yang berwenang dan perbedaan objek pengujiannya.
