id: HUK-KENALI-013
domain: hukum
level: pahami
type: multiple-choice
question: Hak konstitusional mana yang relevan jika seseorang menuntut aturan yang jelas dan perlakuan yang sama dalam proses hukum?
options:
  - Hak atas pengakuan, jaminan, perlindungan, dan kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum
  - Hak untuk memperoleh imbalan dan perlakuan yang adil dalam hubungan kerja
  - Hak untuk mendapat perlindungan diri, keluarga, kehormatan, dan harta benda
  - Hak untuk memperoleh kesempatan yang sama dalam pemerintahan
answer: 0
explanation: Pasal 28D ayat (1) UUD 1945 menjamin kepastian hukum yang adil serta perlakuan yang sama di hadapan hukum bagi setiap orang. Jaminan tersebut menghendaki proses yang berlandaskan hukum dan tidak diskriminatif, bukan kewenangan untuk mengganti putusan secara pribadi.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 28D ayat (1). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
