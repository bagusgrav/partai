id: HUK-KENALI-014
domain: hukum
level: kenali
type: multiple-choice
question: Lembaga mana yang berwenang menguji peraturan perundang-undangan di bawah undang-undang terhadap undang-undang menurut UUD 1945?
options:
  - Mahkamah Agung
  - Mahkamah Konstitusi
  - Pengadilan Tata Usaha Negara
  - Komisi Yudisial
answer: 0
explanation: Pasal 24A ayat (1) UUD 1945 memberikan Mahkamah Agung kewenangan menguji peraturan perundang-undangan di bawah undang-undang terhadap undang-undang. Pengujian undang-undang terhadap UUD 1945 merupakan kewenangan Mahkamah Konstitusi.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 24A ayat (1) dan Pasal 24C ayat (1). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
