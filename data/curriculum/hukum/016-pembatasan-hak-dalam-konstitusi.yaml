id: HUK-KENALI-016
domain: hukum
level: pahami
type: multiple-choice
question: Menurut Pasal 28J ayat (2) UUD 1945, pembatasan hak dan kebebasan harus ditetapkan dengan apa dan untuk tujuan apa?
options:
  - Dengan undang-undang, untuk menjamin pengakuan dan penghormatan hak orang lain serta memenuhi tuntutan yang adil dalam masyarakat demokratis
  - Dengan keputusan pejabat, selama pembatasan dianggap perlu oleh pemerintah
  - Dengan undang-undang, tetapi tanpa mempertimbangkan hak orang lain
  - Dengan peraturan pemerintah, untuk membatasi hak tanpa tujuan yang ditetapkan konstitusi
answer: 0
explanation: Pasal 28J ayat (2) UUD 1945 mengatur bahwa pembatasan hak ditetapkan dengan undang-undang dan memiliki tujuan konstitusional, termasuk menghormati hak orang lain serta memenuhi tuntutan yang adil. Pembatasan karena itu tidak boleh semata-mata didasarkan pada kehendak pribadi pejabat.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 28J ayat (2). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
