id: HUK-KENALI-017
domain: hukum
level: kenali
type: multiple-choice
question: Sifat apa yang diwajibkan UUD 1945 bagi kekuasaan kehakiman?
options:
  - Merdeka untuk menyelenggarakan peradilan guna menegakkan hukum dan keadilan
  - Merdeka dalam memutus perkara, tetapi berada di bawah arahan eksekutif dalam pemeriksaan
  - Menyelenggarakan peradilan sebagai bagian dari kekuasaan pemerintahan
  - Mengadili perkara sesuai dengan kebijakan lembaga yang mengangkat hakim
answer: 0
explanation: Pasal 24 ayat (1) UUD 1945 menyatakan bahwa kekuasaan kehakiman merupakan kekuasaan yang merdeka untuk menyelenggarakan peradilan guna menegakkan hukum dan keadilan. Kemerdekaan ini melindungi proses peradilan dari campur tangan yang tidak sah.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 24 ayat (1). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
