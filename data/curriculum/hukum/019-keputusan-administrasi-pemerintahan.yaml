id: HUK-KENALI-019
domain: hukum
level: kenali
type: multiple-choice
question: Undang-undang umum apa yang menjadi dasar pengaturan administrasi pemerintahan dan keputusan pejabat pemerintahan?
options:
  - UU Nomor 30 Tahun 2014 tentang Administrasi Pemerintahan
  - UU Nomor 25 Tahun 2009 tentang Pelayanan Publik
  - UU Nomor 5 Tahun 1986 tentang Peradilan Tata Usaha Negara
  - UU Nomor 20 Tahun 2023 tentang Aparatur Sipil Negara
answer: 0
explanation: UU Nomor 30 Tahun 2014 mengatur administrasi pemerintahan, termasuk penggunaan wewenang dan keputusan atau tindakan badan maupun pejabat pemerintahan. Undang-undang tersebut menjadi salah satu dasar untuk memastikan penyelenggaraan administrasi berjalan sesuai hukum dan asas pemerintahan yang baik.
sources:
  - citation: "Undang-Undang Nomor 30 Tahun 2014 tentang Administrasi Pemerintahan. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Nomor%2030%20Tahun%202014%20Administrasi%20Pemerintahan"
