id: HUK-KENALI-021
domain: hukum
level: kenali
type: multiple-choice
question: Menurut Pasal 20 ayat (2) UUD 1945, siapa yang membahas rancangan undang-undang?
options:
  - DPR dan Presiden untuk mendapat persetujuan bersama
  - DPR dan DPD untuk mendapat persetujuan bersama
  - Presiden dan DPD untuk mendapat persetujuan bersama
  - DPR sendiri setelah meminta pertimbangan Mahkamah Agung
answer: 0
explanation: Pasal 20 ayat (2) UUD 1945 menyatakan bahwa setiap rancangan undang-undang dibahas oleh DPR dan Presiden untuk mendapat persetujuan bersama. Proses pembentukan undang-undang karena itu melibatkan pembahasan dan persetujuan bersama, bukan keputusan satu lembaga saja.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 20 ayat (2). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
