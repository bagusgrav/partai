id: HUK-KENALI-022
domain: hukum
level: pahami
type: multiple-choice
question: Mengapa peraturan perundang-undangan perlu dibentuk melalui prosedur dan lembaga yang berwenang?
options:
  - Agar peraturan memiliki dasar kewenangan dan proses pembentukan yang dapat diuji menurut hukum
  - Agar setiap peraturan dapat disusun oleh lembaga mana pun yang dianggap berkepentingan
  - Agar peraturan dapat berlaku tanpa memperhatikan hierarki hukum
  - Agar proses pembentukan peraturan tidak memerlukan keterlibatan publik
answer: 0
explanation: UU Nomor 12 Tahun 2011 mengatur jenis, hierarki, dan proses pembentukan peraturan perundang-undangan, termasuk asas kelembagaan atau pejabat pembentuk yang tepat. Prosedur yang sah memperjelas kewenangan dan memungkinkan publik mengetahui serta menilai aturan yang berlaku.
sources:
  - citation: "Undang-Undang Nomor 12 Tahun 2011 tentang Pembentukan Peraturan Perundang-undangan, sebagaimana diubah dengan UU Nomor 13 Tahun 2022, Pasal 5 dan Pasal 7. URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Nomor%2012%20Tahun%202011%20Pembentukan%20Peraturan%20Perundang-undangan"
