id: POL-KENALI-006
domain: politik-bernegara
level: kenali
type: multiple-choice
question: Siapakah yang memegang kekuasaan pemerintahan menurut UUD 1945?
options:
  - Presiden
  - Ketua DPR
  - Ketua Mahkamah Agung
  - Ketua Komisi Pemilihan Umum
answer: 0
explanation: Pasal 4 ayat (1) UUD 1945 menyatakan bahwa Presiden Republik Indonesia memegang kekuasaan pemerintahan menurut Undang-Undang Dasar. Presiden dan Wakil Presiden dipilih dalam satu pasangan secara langsung oleh rakyat.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 4 ayat (1) dan Pasal 6A ayat (1)."

