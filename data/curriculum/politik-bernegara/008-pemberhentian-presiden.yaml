id: POL-KENALI-008
domain: politik-bernegara
level: kenali
type: multiple-choice
question: Dalam proses pemberhentian Presiden atau Wakil Presiden, lembaga manakah yang terlebih dahulu memeriksa dan memutus pendapat DPR tentang dugaan pelanggaran?
options:
  - Mahkamah Konstitusi
  - Mahkamah Agung
  - Komisi Pemilihan Umum
  - Dewan Perwakilan Daerah
answer: 0
explanation: Berdasarkan Pasal 7B UUD 1945, DPR dapat mengajukan pendapat mengenai dugaan pelanggaran oleh Presiden atau Wakil Presiden kepada Mahkamah Konstitusi untuk diperiksa dan diputus. Jika syarat konstitusional terpenuhi, proses selanjutnya melibatkan MPR.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 7A dan Pasal 7B."
