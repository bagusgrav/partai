id: POL-KENALI-015
domain: politik-bernegara
level: pahami
type: multiple-choice
question: Bagaimana pemerintah daerah menjalankan otonomi menurut Pasal 18 ayat (2) UUD 1945?
options:
  - Mengatur dan mengurus sendiri urusan pemerintahan menurut asas otonomi dan tugas pembantuan
  - Menjalankan seluruh urusan pemerintahan berdasarkan instruksi pemerintah pusat
  - Mengatur urusan pemerintahan secara mandiri tanpa tunduk pada undang-undang nasional
  - Menjalankan hanya kewenangan yang didelegasikan pemerintah pusat tanpa otonomi daerah
answer: 0
explanation: Pasal 18 ayat (2) UUD 1945 menyatakan bahwa pemerintah daerah provinsi, kabupaten, dan kota mengatur serta mengurus sendiri urusan pemerintahan menurut asas otonomi dan tugas pembantuan. Otonomi dijalankan dalam kerangka Negara Kesatuan Republik Indonesia dan tetap tunduk pada UUD serta undang-undang.
sources:
  - citation: "Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, Pasal 18 ayat (2) dan ayat (5). URL: https://peraturan.bpk.go.id/Search?keywords=Undang-Undang%20Dasar%20Negara%20Republik%20Indonesia%20Tahun%201945"
